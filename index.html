/* Layout: one narrow column. Stats, week strip of stamps, today's checklist, month calendar. */
:root {
  --bg: #eff2ef;
  --surface: #fbfcfa;
  --ink: #1c2923;
  --muted: #64736b;
  --line: #d6ddd8;
  --stamp: #c23a2b;
  --stamp-soft: #f7e0dc;
  --ok: #2d6a4d;
  --ok-soft: #dcebe3;
  --star: #d08a00;
  --star-soft: #fbefcf;
  --pink: #e0488a;
  --pink-soft: #fde4ef;
  --c-pink: #e0488a; --c-blue: #2f6fd0; --c-green: #2a9657; --c-orange: #d9701a; --c-purple: #8353d1;
  --display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715;
    --surface: #1a2320;
    --ink: #e7eee9;
    --muted: #92a199;
    --line: #2c3833;
    --stamp: #ec6554;
    --stamp-soft: #3b2420;
    --ok: #74c19b;
    --ok-soft: #21392f;
    --star: #f2c14e;
    --star-soft: #3a3118;
    --pink: #ff7fb2;
    --pink-soft: #3d2231;
    --c-pink: #ff7fb2; --c-blue: #7fb2ff; --c-green: #6fd49b; --c-orange: #ffb066; --c-purple: #c4a1ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715;
  --surface: #1a2320;
  --ink: #e7eee9;
  --muted: #92a199;
  --line: #2c3833;
  --stamp: #ec6554;
  --stamp-soft: #3b2420;
  --ok: #74c19b;
  --ok-soft: #21392f;
  --star: #f2c14e;
  --star-soft: #3a3118;
  --pink: #ff7fb2;
  --pink-soft: #3d2231;
  --c-pink: #ff7fb2; --c-blue: #7fb2ff; --c-green: #6fd49b; --c-orange: #ffb066; --c-purple: #c4a1ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  padding-inline: 16px;
  padding-block: 20px 48px;
}
.app { max-width: 520px; margin-inline: auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

header h1 { font: 400 28px/1.2 var(--display); margin: 0; letter-spacing: .01em; }
header p { margin: 2px 0 0; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat strong { font: 400 24px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.stat strong span { font: 500 13px var(--body); color: var(--muted); margin-left: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel h2 { font: 700 13px/1 var(--body); letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }

/* stamp */
.seal {
  --size: 40px;
  width: var(--size); height: var(--size);
  border-radius: 50%;
  border: 2.5px solid var(--stamp);
  box-shadow: inset 0 0 0 2.5px var(--surface), inset 0 0 0 4px var(--stamp);
  color: var(--stamp);
  display: grid; place-items: center;
  font: 400 calc(var(--size) * .36)/1.1 var(--display);
  transform: rotate(var(--rot, 0deg));
  text-align: center;
  opacity: .95;
}

.seal.pop { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(var(--rot, 0deg)) scale(2.2); opacity: 0; } to { transform: rotate(var(--rot, 0deg)) scale(1); opacity: .95; } }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { position: relative; background: none; border: 0; padding: 4px 0; display: grid; justify-items: center; gap: 6px; border-radius: 10px; min-width: 0; }
.wd .dow { font-size: 12px; color: var(--muted); font-weight: 500; }
.wd.sel { background: var(--ok-soft); }
.wd.today .dow { color: var(--ink); font-weight: 700; }
.wd:disabled { cursor: default; opacity: .55; }
.slot {
  --size: 40px;
  width: var(--size); height: var(--size); border-radius: 50%;
  border: 1.5px dashed var(--line);
  display: grid; place-items: center;
  color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
}
.slot.part { border-style: solid; border-color: var(--ok); color: var(--ok); }
.week .seal, .week .slot { --size: clamp(30px, 9vw, 40px); }
.goal { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.goal b { color: var(--ok); }

/* day card */
.day-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.day-head h2 { margin: 0 0 4px; }
.day-head .date { font: 400 22px/1.25 var(--display); }
.stamp-area:has(.seal) { min-height: 150px; }
.stamp-area { min-height: 0; display: grid; place-items: center; }
.tasks { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.task { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.task.done { border-color: var(--ok); background: var(--ok-soft); }
.task-btn { width: 100%; background: none; border: 0; display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; }
.task-btn:disabled { cursor: default; opacity: .6; }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; font-weight: 700; }
.task.done .box { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.task-text { min-width: 0; }
.task-text b { display: block; font-weight: 700; }
.task-text span { display: block; font-size: 13px; color: var(--muted); }
details { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 14px; }
summary { cursor: pointer; color: var(--muted); }
details ol { margin: 8px 0 4px; padding-left: 20px; }

/* month */
.mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mhead h2 { margin: 0; }
.mhead .nav { display: flex; gap: 6px; }
.nav button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: none; }
.nav button:disabled { opacity: .35; cursor: default; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.mgrid .h { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cell { position: relative; background: none; border: 0; border-radius: 10px; padding: 3px 0; display: grid; justify-items: center; min-width: 0; aspect-ratio: 1; align-content: center; }
.cell.sel { background: var(--ok-soft); }
.cell.today .slot { border-color: var(--ink); border-style: solid; color: var(--ink); font-weight: 700; }
.cell:disabled { cursor: default; opacity: .5; }
.mgrid .seal, .mgrid .slot { --size: clamp(28px, 8vw, 36px); }
.cell.blank { visibility: hidden; }

.stars { position: absolute; top: 0; right: 2px; font-size: 11px; line-height: 1; color: var(--star); font-style: normal; letter-spacing: -1px; }
.mk-row { position: absolute; top: 0; left: 2px; display: flex; gap: 1px; font-size: 11px; line-height: 1; }
.mk { font-style: normal; }
.mark-bar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.mark-btn { --mc: var(--ink); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: none; }
.mark-btn .g { color: var(--mc); font-size: 15px; line-height: 1; }
.mark-btn.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 16%, var(--surface)); font-weight: 700; }
.mark-btn:disabled { cursor: default; opacity: .6; }
.mrow select { flex: none; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.chip { border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px; background: none; font-size: 13px; color: var(--muted); }
.note { position: absolute; bottom: 2px; right: 2px; font-size: 10px; line-height: 1; color: var(--muted); font-style: normal; }
.diary { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.diary label { display: block; font-weight: 700; margin-bottom: 8px; }
.diary input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.diary input:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
.reward { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; }
.reward h2 { font: 700 13px/1 var(--body); letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
.reward .big { font: 400 22px/1.3 var(--display); margin: 0; }
.reward .big small { font: 500 14px var(--body); color: var(--muted); margin-left: 4px; }
.dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 12px 0; max-width: 360px; }
.dots i { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed var(--line); }
.dots i.on { border: 2px solid var(--stamp); background: var(--stamp-soft); box-shadow: inset 0 0 0 2.5px var(--surface), inset 0 0 0 4px var(--stamp); }
.reward .hint { margin: 0; font-size: 13px; color: var(--muted); }
.ticket { display: grid; grid-template-columns: 1fr auto; border: 2px solid var(--star); border-radius: 14px; background: var(--star-soft); overflow: hidden; }
.ticket .main { padding: 14px 16px; min-width: 0; }
.ticket .main small { display: block; font-size: 12px; letter-spacing: .08em; color: var(--star); font-weight: 700; }
.ticket .main b { display: block; font: 400 24px/1.25 var(--display); margin: 2px 0; }
.ticket .main span { font-size: 13px; color: var(--muted); }
.ticket .stub { border-left: 2px dashed var(--star); padding: 12px; display: grid; place-items: center; text-align: center; font: 400 13px/1.3 var(--display); color: var(--star); min-width: 78px; }
.ticket.used { border-color: var(--line); background: var(--surface); }
.ticket.used .main small, .ticket.used .stub { color: var(--muted); border-color: var(--line); }
.ticket.used .main b { text-decoration: line-through; color: var(--muted); }
.use-btn { margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--star); background: none; color: var(--ink); font-weight: 700; }
.srow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.srow label { flex: none; width: 64px; font-weight: 700; }
.srow input[type=text], .srow input[type=number] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.srow input[type=number] { max-width: 100px; flex: none; }
.srow input:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
.srow .unit { color: var(--muted); }
.opt { margin-top: 16px; }
.check { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.err-note { color: var(--stamp); margin: 8px 0 0; font-size: 14px; }
.sbtns { display: flex; gap: 8px; margin-top: 16px; }
.sbtns button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: none; font-weight: 700; }
.sbtns .primary { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.todo-add { display: flex; gap: 8px; }
.todo-add input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.todo-add input:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
.todo-add button { flex: none; border: 0; border-radius: 10px; padding: 0 16px; background: var(--ok); color: var(--surface); font-weight: 700; }
.todos { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.todos li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 10px; }
.todos .t-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tbox { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); background: none; padding: 0; }
.tdel { flex: none; width: 30px; height: 30px; border: 0; background: none; color: var(--muted); font-size: 18px; border-radius: 8px; }
.todos.done li { background: none; color: var(--muted); }
.todos.done .t-text { text-decoration: line-through; }
.todos.done .tbox { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 700; display: grid; place-items: center; }
.empty-note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
.goto { margin-top: 12px; width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; background: none; color: var(--ink); }
.extra { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.extra.done { border-color: var(--star); background: var(--star-soft); }
.extra label { display: block; font-weight: 700; margin-bottom: 8px; }
.extra-row { display: flex; gap: 8px; align-items: center; }
.extra input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.extra input[type=text]:focus-visible { outline: 2px solid var(--star); outline-offset: 1px; }
.extra .box { background: none; padding: 0; }
.extra.done .box { background: var(--star); border-color: var(--star); color: var(--surface); }
.extra-btn { flex: none; background: none; border: 0; padding: 0; }
.extra-btn:disabled { opacity: .4; cursor: default; }
.exc { margin: 10px 0 0; font: 400 18px/1.3 var(--display); color: var(--star); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }

@media (prefers-reduced-motion: reduce) { .seal.pop { animation: none; } }

html { background: var(--bg); }
body { margin: 0; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(48px, env(safe-area-inset-bottom)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); -webkit-text-size-adjust: 100%; }
button, input, textarea { -webkit-tap-highlight-color: transparent; }
input, textarea { font-size: 16px; }
.backup { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.backup .lbl { display: block; margin: 12px 0 4px; font-weight: 700; font-size: 14px; }
.backup textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.backup input[type=file] { width: 100%; font-size: 14px; }
</style>

</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
(function () {
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var LS = "my-day-pwa-v1";

  var state = { days: {}, extra: {}, period: {}, markDays: {}, diary: {}, todos: {}, rewards: {}, earned: {}, settings: { setup: false, plan: {}, goal: 12, rewardName: "", rewardNote: "", marks: [] } };
  var ready = false, editing = false, touchedSettings = false;
  var mode = "local"; // local | account
  var ref = null, unsub = null, writing = false, dirty = false, unsynced = false, applied = false, touched = {};
  var todayKey = keyOf(new Date());
  var selected = todayKey;
  var view = (function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
  var justStamped = null;
  var app = document.getElementById("app");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dateOf(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(k, n) { var d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function plan(k) { return state.settings.plan[dateOf(k).getDay()] || []; }
  function weekGoal() { var n = 0; for (var i = 0; i < 7; i++) if ((state.settings.plan[i] || []).length) n++; return Math.max(1, Math.min(4, n)); }
  function monthGoal() { return Math.max(1, Math.min(31, +state.settings.goal || 12)); }
  function doneIds(k) { return state.days[k] || []; }
  function stamped(k) { return !!state.earned[k]; }
  function partial(k) { return doneIds(k).length > 0 && !stamped(k); }
  function extraOf(k) { return state.extra[k] || { text: "", done: false }; }
  function excellent(k) { var x = extraOf(k); return !!x.done && !!x.text.trim(); }
  function note(k) { return (state.diary[k] || "").trim() ? '<i class="note" aria-label="일기 있음">✎</i>' : ""; }
  function setDiary(k, text) {
    touched[k] = true;
    if (text.trim()) state.diary[k] = text; else delete state.diary[k];
    unsynced = true;
    saveLocal();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
  }
  function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function todosOf(k) { return state.todos[k] || []; }
  function saveTodos(k, list) {
    touched[k] = true;
    if (list.length) state.todos[k] = list; else delete state.todos[k];
    justStamped = null;
    persist();
    render();
  }
  function addTodo(k, text) {
    text = text.trim();
    if (!text) return;
    saveTodos(k, todosOf(k).concat([{ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: text, d: false }]));
    var inp = document.getElementById("todo-text");
    if (inp) inp.focus();
  }
  function changeTodo(k, id, fn) {
    saveTodos(k, todosOf(k).map(function (x) { return x.id === id ? fn(x) : x; }).filter(Boolean));
  }
  function monthKey(y, m) { return y + "-" + pad(m + 1); }
  function monthStamps(y, m) {
    var n = new Date(y, m + 1, 0).getDate(), c = 0;
    for (var d = 1; d <= n; d++) if (stamped(monthKey(y, m) + "-" + pad(d))) c++;
    return c;
  }
  function toggleTicket(mk) {
    touched[mk] = true;
    if (state.rewards[mk]) delete state.rewards[mk]; else state.rewards[mk] = true;
    justStamped = null;
    persist();
    render();
  }
  function rewardCard() {
    var nd = new Date(), y = nd.getFullYear(), m = nd.getMonth(), mk = monthKey(y, m);
    var n = monthStamps(y, m), got = n >= monthGoal(), used = !!state.rewards[mk];
    var left = monthGoal() - n, daysLeft = new Date(y, m + 1, 0).getDate() - nd.getDate() + 1;
    var dots = "";
    for (var i = 0; i < monthGoal(); i++) dots += "<i" + (i < n ? ' class="on"' : "") + "></i>";
    var h = '<section class="reward" aria-label="이번 달 보상"><h2>' + (m + 1) + '월 보상 목표</h2>';
    h += '<p class="big">' + Math.min(n, monthGoal()) + " / " + monthGoal() + "<small>도장</small></p>";
    h += '<div class="dots" aria-hidden="true">' + dots + "</div>";
    if (!got) {
      h += '<p class="hint">' + (left > daysLeft ? "이번 달 " + monthGoal() + "개는 어려워졌지만 괜찮아요. 모은 도장은 그대로 남아요." : "남은 " + daysLeft + "일 중 도장 " + left + "개만 더 모으면 보상권이 생겨요.") + "</p>";
    } else {
      h += '<div class="ticket' + (used ? " used" : "") + '"><div class="main"><small>나만의 보상권</small><b>' + esc(state.settings.rewardName || "나만의 보상") + '</b><span>' + (m + 1) + "월 도장 " + monthGoal() + "개 달성" + (state.settings.rewardNote ? " · " + esc(state.settings.rewardNote) : "") + "</span></div><div class=\"stub\">" + (used ? "사용<br>완료" : "참<br>잘했어요") + "</div></div>";
      h += '<button class="use-btn" data-ticket="' + mk + '">' + (used ? "사용 취소" : "보상 사용했어요") + "</button>";
    }
    return h + "</section>";
  }

  var FIELDS = ["days", "extra", "period", "markDays", "diary", "todos", "rewards", "earned", "settings"];
  function backupHtml() {
    return '<details class="backup"><summary>백업 · 복원</summary>' +
      '<p class="empty-note" style="margin-top:8px">기록은 이 폰 안에만 저장돼요. 폰을 바꾸기 전에 백업해 두면 그대로 옮길 수 있어요.</p>' +
      '<div class="sbtns"><button type="button" data-export="1">파일로 백업</button><button type="button" data-copy="1">내용 복사</button></div>' +
      '<label class="lbl" for="restore-file">파일로 복원</label><input type="file" id="restore-file" accept="application/json,.json">' +
      '<label class="lbl" for="restore-text">복사한 내용으로 복원</label><textarea id="restore-text" rows="3" placeholder="복사해 둔 백업 내용을 붙여넣어요"></textarea>' +
      '<div class="sbtns"><button type="button" data-restore="1">붙여넣은 내용으로 복원</button></div>' +
      '<p class="empty-note" id="backup-msg" role="status"></p></details>';
  }
  function dump() { var o = {}; FIELDS.forEach(function (f) { o[f] = state[f]; }); return JSON.stringify(o); }
  function backupMsg(t) { var el = document.getElementById("backup-msg"); if (el) el.textContent = t; }
  function exportData() {
    try {
      var blob = new Blob([dump()], { type: "application/json" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "나의하루-백업-" + todayKey + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      backupMsg("백업 파일을 만들었어요.");
    } catch (e) { backupMsg("파일을 만들지 못했어요. 대신 '내용 복사'를 써보세요."); }
  }
  function copyData() {
    var t = dump();
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(
      function () { backupMsg("복사했어요. 메모 앱 같은 곳에 붙여넣어 보관해 두세요."); },
      function () { var ta = document.getElementById("restore-text"); if (ta) { ta.value = t; ta.select(); } backupMsg("아래 칸에 내용을 채웠어요. 직접 복사해 주세요."); });
  }
  function restoreFrom(text) {
    var o;
    try { o = JSON.parse(text); } catch (e) { backupMsg("백업 내용이 올바르지 않아요."); return; }
    if (!o || typeof o !== "object" || !o.settings || !o.settings.plan) { backupMsg("백업 내용이 올바르지 않아요."); return; }
    FIELDS.forEach(function (f) { if (o[f] && typeof o[f] === "object") state[f] = o[f]; });
    migrateMarks(); saveLocal(); editing = false; render();
    backupMsg("복원했어요.");
  }
  function setReady() { if (!ready) { ready = true; render(); } }
  function splitList(v) { return v.split(/[,，、\n]/).map(function (x) { return x.trim().slice(0, 40); }).filter(Boolean); }
  function markForm() {
    var defs = markDefs(), h = '<details class="opt"' + (defs.length ? " open" : "") + '><summary>나만의 표시 (선택)</summary><p class="empty-note" style="margin:8px 0">달력에 따로 표시하고 싶은 날에 이름과 모양을 붙여요. 최대 3개까지예요.</p>';
    h += '<div class="chips">' + [["생리", "♥", "pink"], ["약 먹은 날", "●", "blue"], ["술 마신 날", "▲", "orange"], ["몸이 안 좋은 날", "◆", "purple"]].map(function (c) {
      return '<button type="button" class="chip" data-chip="' + c.join("|") + '">+ ' + c[0] + "</button>";
    }).join("") + "</div>";
    for (var i = 0; i < 3; i++) {
      var m = defs[i] || { label: "", icon: ICONS[i], color: COLORS[i][0] };
      h += '<div class="srow mrow"><input type="text" id="mk-' + i + '" maxlength="12" placeholder="이름" value="' + esc(m.label) + '" aria-label="표시 이름 ' + (i + 1) + '">' +
        '<select id="mi-' + i + '" aria-label="모양">' + ICONS.map(function (ic) { return '<option value="' + ic + '"' + (ic === m.icon ? " selected" : "") + ">" + ic + "</option>"; }).join("") + "</select>" +
        '<select id="mc-' + i + '" aria-label="색">' + COLORS.map(function (c) { return '<option value="' + c[0] + '"' + (c[0] === m.color ? " selected" : "") + ">" + c[1] + "</option>"; }).join("") + "</select></div>";
    }
    return h + "</details>";
  }
  function renderSetup() {
    var st = state.settings, order = [1, 2, 3, 4, 5, 6, 0];
    var h = '<header><h1>나의 하루</h1><p>' + (st.setup ? "설정을 바꿔요." : "처음 한 번만 적으면 돼요.") + "</p></header>";
    h += '<form class="panel setup" id="setup-form" autocomplete="off"><h2>요일별 운동</h2><p class="empty-note" style="margin:0 0 12px">하는 운동을 적어요. 여러 개면 쉼표(,)로 나누고, 쉬는 날은 비워두세요.</p>';
    order.forEach(function (d) {
      var txt = (st.plan[d] || []).map(function (x) { return x.label; }).join(", ");
      h += '<div class="srow"><label for="sp-' + d + '">' + DOW[d] + '</label><input type="text" id="sp-' + d + '" maxlength="80" placeholder="예: 요가 30분, 스트레칭" value="' + esc(txt) + '"></div>';
    });
    h += '<h2 style="margin-top:20px">보상</h2>' +
      '<div class="srow"><label for="sp-goal">월 목표</label><input type="number" inputmode="numeric" id="sp-goal" min="1" max="31" value="' + monthGoal() + '"><span class="unit">개</span></div>' +
      '<div class="srow"><label for="sp-reward">보상</label><input type="text" id="sp-reward" maxlength="40" placeholder="예: 마사지 받기" value="' + esc(st.rewardName) + '"></div>' +
      '<div class="srow"><label for="sp-note">메모</label><input type="text" id="sp-note" maxlength="40" placeholder="선택 · 예: 5만원 이내" value="' + esc(st.rewardNote) + '"></div>' +
      markForm() +
      '<p class="err-note" id="setup-err" role="alert" hidden>운동을 하나 이상 적어주세요.</p>' +
      '<div class="sbtns"><button type="submit" class="primary">' + (st.setup ? "저장" : "시작하기") + "</button>" + (st.setup ? '<button type="button" data-cancel="1">취소</button>' : "") + "</div></form>";
    app.innerHTML = h;
  }
  function saveSettings() {
    var plan = {}, any = false;
    [0, 1, 2, 3, 4, 5, 6].forEach(function (d) {
      var items = splitList(document.getElementById("sp-" + d).value).map(function (label, i) { return { id: d + "-" + i + "-" + label, label: label }; });
      if (items.length) { plan[d] = items; any = true; }
    });
    if (!any) { document.getElementById("setup-err").hidden = false; return; }
    state.settings = {
      setup: true, plan: plan,
      goal: Math.max(1, Math.min(31, parseInt(document.getElementById("sp-goal").value, 10) || 12)),
      rewardName: document.getElementById("sp-reward").value.trim(),
      rewardNote: document.getElementById("sp-note").value.trim(),
      marks: collectMarks()
    };
    touchedSettings = true;
    editing = false;
    persist();
    render();
  }
  var ICONS = ["♥", "●", "▲", "◆", "✚"], COLORS = [["pink", "분홍"], ["blue", "파랑"], ["green", "초록"], ["orange", "주황"], ["purple", "보라"]];
  function marksOf(k) { return state.markDays[k] || []; }
  function markDefs() { return state.settings.marks || []; }
  function markHtml(k) {
    var ids = marksOf(k), out = markDefs().filter(function (m) { return ids.indexOf(m.id) >= 0; }).map(function (m) {
      return '<i class="mk" style="color:var(--c-' + m.color + ')">' + m.icon + "</i>";
    }).join("");
    return out ? '<span class="mk-row">' + out + "</span>" : "";
  }
  function markAria(k) {
    var ids = marksOf(k);
    return markDefs().filter(function (m) { return ids.indexOf(m.id) >= 0; }).map(function (m) { return " " + m.label; }).join("");
  }
  function toggleMark(k, id) {
    if (k > todayKey) return;
    touched[k] = true;
    var ids = marksOf(k).slice(), i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    if (ids.length) state.markDays[k] = ids; else delete state.markDays[k];
    justStamped = null;
    persist();
    render();
  }
  function migrateMarks() {
    var st = state.settings;
    if (!st.setup || st.marks) return;
    st.marks = st.period ? [{ id: "period", label: "생리", icon: "♥", color: "pink" }] : [];
    delete st.period;
    Object.keys(state.period || {}).forEach(function (k) { if (state.period[k]) state.markDays[k] = (state.markDays[k] || []).concat(["period"]); });
    state.period = {};
  }
  function fillChip(v) {
    var a = v.split("|"), idx = -1;
    for (var i = 0; i < 3; i++) if (!document.getElementById("mk-" + i).value.trim()) { idx = i; break; }
    if (idx < 0) idx = 2;
    document.getElementById("mk-" + idx).value = a[0];
    document.getElementById("mi-" + idx).value = a[1];
    document.getElementById("mc-" + idx).value = a[2];
  }
  function collectMarks() {
    var old = markDefs(), out = [];
    for (var i = 0; i < 3; i++) {
      var label = document.getElementById("mk-" + i).value.trim().slice(0, 12);
      if (!label) continue;
      var prev = old.filter(function (m) { return m.label === label; })[0];
      out.push({ id: prev ? prev.id : "m" + Date.now().toString(36) + i, label: label, icon: document.getElementById("mi-" + i).value, color: document.getElementById("mc-" + i).value });
    }
    return out;
  }
  function stars(k) { return excellent(k) ? '<i class="stars" aria-label="엑설런트">★★</i>' : ""; }
  var saveTimer = null;
  function setExtraText(k, text) {
    var x = extraOf(k);
    touched[k] = true;
    if (text.trim() || x.done) state.extra[k] = { text: text, done: x.done }; else delete state.extra[k];
    unsynced = true;
    saveLocal();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
  }
  function toggleExtra(k) {
    if (k > todayKey) return;
    var x = extraOf(k);
    if (!x.text.trim()) return;
    touched[k] = true;
    state.extra[k] = { text: x.text, done: !x.done };
    justStamped = null;
    persist();
    render();
  }
  function rot(k) { var d = +k.slice(-2); return ((d * 37) % 9) - 4; }
  function mondayOf(k) { var d = dateOf(k); var off = (d.getDay() + 6) % 7; return addDays(k, -off); }
  function longDate(k) { var d = dateOf(k); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DOW[d.getDay()] + "요일"; }

  function load() {
    try { var raw = localStorage.getItem(LS); if (raw) { var o = JSON.parse(raw); if (o && o.days) state.days = o.days; if (o && o.extra) state.extra = o.extra; if (o && o.period) state.period = o.period; if (o && o.markDays) state.markDays = o.markDays; if (o && o.diary) state.diary = o.diary; if (o && o.todos) state.todos = o.todos; if (o && o.rewards) state.rewards = o.rewards; if (o && o.earned) state.earned = o.earned; if (o && o.settings) state.settings = o.settings; } } catch (e) {}
  }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ days: state.days, extra: state.extra, markDays: state.markDays, diary: state.diary, todos: state.todos, rewards: state.rewards, earned: state.earned, settings: state.settings })); } catch (e) {} }
  function flush() {
    if (!ref) return;
    if (writing) { dirty = true; return; }
    writing = true;
    (async function () {
      try { do { dirty = false; await ref.set({ days: state.days, extra: state.extra, markDays: state.markDays, diary: state.diary, todos: state.todos, rewards: state.rewards, earned: state.earned, settings: state.settings }); } while (dirty); unsynced = false; }
      catch (e) { ref = null; if (unsub) { try { unsub(); } catch (x) {} unsub = null; } mode = "local"; unsynced = false; render(); }
      finally { writing = false; }
    })();
  }
  function persist() { unsynced = true; saveLocal(); flush(); }

  function toggle(k, id) {
    if (k > todayKey) return;
    var ids = doneIds(k).slice();
    var i = ids.indexOf(id);
    var was = stamped(k);
    touched[k] = true;
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    if (ids.length) state.days[k] = ids; else delete state.days[k];
    var need = plan(k);
    if (need.length && need.every(function (x) { return ids.indexOf(x.id) >= 0; })) state.earned[k] = true; else delete state.earned[k];
    justStamped = (!was && stamped(k)) ? k : null;
    persist();
    render();
  }

  function stats() {
    var keys = Object.keys(state.earned).filter(stamped);
    var total = keys.length;
    var cur = todayKey;
    if (!stamped(cur)) cur = addDays(cur, -1);
    var streak = 0;
    while (stamped(cur)) { streak++; cur = addDays(cur, -1); }
    var mon = mondayOf(todayKey), week = 0;
    for (var i = 0; i < 7; i++) if (stamped(addDays(mon, i))) week++;
    return { total: total, streak: streak, week: week };
  }

  function seal(k, big) {
    var d = +k.slice(-2);
    return '<span class="seal' + (big ? " big" : "") + '"' + (big ? ' role="img" aria-label="참 잘했어요"' : "") + ' style="--rot:' + rot(k) + 'deg">' + (big ? "" : d) + "</span>";
  }
  function slot(k) {
    var d = +k.slice(-2);
    return '<span class="slot' + (partial(k) ? " part" : "") + '">' + d + "</span>";
  }

  function render() {
    if (!ready) { app.innerHTML = '<p class="foot" style="padding-block:48px">불러오는 중...</p>'; return; }
    if (!state.settings.setup || editing) { renderSetup(); return; }
    var s = stats();
    var mon = mondayOf(todayKey);
    var h = "";
    h += '<header><h1>나의 하루</h1><p>오늘 한 칸, 도장 하나씩 모아요.</p></header>';
    h += '<section class="stats" aria-label="요약">' +
      '<div class="stat"><small>연속</small><strong>' + s.streak + '<span>일</span></strong></div>' +
      '<div class="stat"><small>이번 주</small><strong>' + s.week + '<span>/ 7</span></strong></div>' +
      '<div class="stat"><small>모은 도장</small><strong>' + s.total + '<span>개</span></strong></div></section>';

    h += rewardCard();

    // week
    h += '<section class="panel"><h2>이번 주</h2><div class="week">';
    for (var i = 0; i < 7; i++) {
      var k = addDays(mon, i);
      h += '<button class="wd' + (k === selected ? " sel" : "") + (k === todayKey ? " today" : "") + '" data-day="' + k + '"' +
        ' aria-label="' + longDate(k) + (stamped(k) ? " 도장 찍음" : "") + (excellent(k) ? " 엑설런트" : "") + markAria(k) + '"><span class="dow">' + DOW[dateOf(k).getDay()] + "</span>" +
        (stamped(k) ? seal(k) : slot(k)) + stars(k) + markHtml(k) + note(k) + "</button>";
    }
    h += "</div>";
    h += '<p class="goal">' + (s.week >= weekGoal() ? "<b>이번 주 목표 달성!</b> 주 " + weekGoal() + "회를 채웠어요." : "이번 주 목표는 " + weekGoal() + "개, 지금 " + s.week + "개예요. 3개만 해도 충분히 잘하고 있어요.") + "</p></section>";

    // day
    var tasks = plan(selected), ids = doneIds(selected), editable = selected <= todayKey;
    var isToday = selected === todayKey;
    h += '<section class="panel"><div class="day-head"><div><h2>' + (isToday ? "오늘" : selected > todayKey ? "미리 보기" : "기록 수정") + '</h2><div class="date">' + longDate(selected) + "</div></div></div>";
    h += '<div class="stamp-area">' + (stamped(selected)
      ? seal(selected, true).replace('class="seal big', 'class="seal big' + (justStamped === selected ? " pop" : ""))
      : '<span class="foot">' + (!tasks.length ? "쉬는 날이에요. 푹 쉬어요." : editable ? "아래 운동을 모두 체크하면 도장이 찍혀요." : "아직 오지 않은 날이에요.") + "</span>") + "</div>";
    h += '<ul class="tasks">';
    tasks.forEach(function (x) {
      var on = ids.indexOf(x.id) >= 0;
      h += '<li class="task' + (on ? " done" : "") + '"><button class="task-btn" data-task="' + x.id + '"' + (editable ? "" : " disabled") + ' aria-pressed="' + on + '">' +
        '<span class="box" aria-hidden="true">✓</span><span class="task-text"><b>' + esc(x.label) + "</b></span></button>";
      h += "</li>";
    });
    h += "</ul>";
    var ex = extraOf(selected), exOn = excellent(selected);
    h += '<div class="extra' + (exOn ? " done" : "") + '"><label for="extra-text">추가 운동 (직접 적기)</label><div class="extra-row">' +
      '<input type="text" id="extra-text" maxlength="60" placeholder="예: 계단 오르기 10분" value="' + ex.text.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;") + '"' + (editable ? "" : " disabled") + ">" +
      '<button class="extra-btn" data-extra="1" aria-pressed="' + exOn + '" aria-label="추가 운동 완료"' + (editable && ex.text.trim() ? "" : " disabled") + '><span class="box" aria-hidden="true">✓</span></button></div>' +
      (exOn ? '<p class="exc">★★ 엑설런트!</p>' : "") + "</div>" +
      (markDefs().length ? '<div class="mark-bar">' + markDefs().map(function (m) {
        var on = marksOf(selected).indexOf(m.id) >= 0;
        return '<button class="mark-btn' + (on ? " on" : "") + '" style="--mc:var(--c-' + m.color + ')" data-mark="' + m.id + '" aria-pressed="' + on + '"' + (editable ? "" : " disabled") + '><span class="g" aria-hidden="true">' + m.icon + "</span>" + esc(m.label) + "</button>";
      }).join("") + "</div>" : "") +
      '<div class="diary"><label for="diary-text">한 줄 일기</label><input type="text" id="diary-text" maxlength="140" placeholder="오늘 하루는 어땠나요?" value="' + (state.diary[selected] || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;") + '"' + (editable ? "" : " disabled") + "></div></section>";

    // todos
    var tl = todosOf(selected), open = tl.filter(function (x) { return !x.d; }), fin = tl.filter(function (x) { return x.d; });
    h += '<section class="panel"><h2>할 일 · ' + longDate(selected) + '</h2><form class="todo-add" id="todo-form" autocomplete="off"><input type="text" id="todo-text" maxlength="80" placeholder="' + (isToday ? "오늘 할 일을 적어요" : "이 날 할 일을 적어요") + '"><button type="submit">추가</button></form>';
    if (open.length) {
      h += '<ul class="todos">' + open.map(function (x) {
        return '<li><button class="tbox" data-todo-done="' + x.id + '" aria-label="완료: ' + esc(x.t) + '"></button><span class="t-text">' + esc(x.t) + '</span><button class="tdel" data-todo-del="' + x.id + '" aria-label="삭제">×</button></li>';
      }).join("") + "</ul>";
    } else h += '<p class="empty-note">' + (fin.length ? "할 일을 모두 끝냈어요!" : "아직 적은 할 일이 없어요.") + "</p>";
    if (fin.length) {
      h += '<details><summary>끝낸 일 ' + fin.length + '개</summary><ul class="todos done" style="margin-top:8px">' + fin.map(function (x) {
        return '<li><button class="tbox" data-todo-undo="' + x.id + '" aria-label="되돌리기: ' + esc(x.t) + '">✓</button><span class="t-text">' + esc(x.t) + '</span><button class="tdel" data-todo-del="' + x.id + '" aria-label="삭제">×</button></li>';
      }).join("") + "</ul></details>";
    }
    if (isToday) h += '<button class="goto" data-goto="' + addDays(todayKey, 1) + '">내일 할 일 미리 쓰기 →</button>';
    else h += '<button class="goto" data-goto="' + todayKey + '">오늘로 돌아가기</button>';
    h += "</section>";

    // month
    var first = new Date(view.y, view.m, 1), lead = (first.getDay() + 6) % 7, days = new Date(view.y, view.m + 1, 0).getDate();
    var monthCount = 0, monthExc = 0, mcount = {};
    for (var d = 1; d <= days; d++) { var dk = view.y + "-" + pad(view.m + 1) + "-" + pad(d); if (stamped(dk)) monthCount++; if (excellent(dk)) monthExc++; marksOf(dk).forEach(function (id) { mcount[id] = (mcount[id] || 0) + 1; }); }
    h += '<section class="panel"><div class="mhead"><h2>' + view.y + "년 " + (view.m + 1) + "월 · 도장 " + monthCount + "개" + (monthExc ? " · ★★ " + monthExc + "개" : "") + markDefs().map(function (m) { return mcount[m.id] ? " · " + m.icon + " " + mcount[m.id] + "일" : ""; }).join("") + (monthCount >= monthGoal() ? " · 보상 ✓" : "") + '</h2><div class="nav">' +
      '<button data-nav="-1" aria-label="이전 달">‹</button><button data-nav="1" aria-label="다음 달">›</button></div></div>';
    h += '<div class="mgrid">' + ["월", "화", "수", "목", "금", "토", "일"].map(function (n) { return '<div class="h">' + n + "</div>"; }).join("");
    for (var b = 0; b < lead; b++) h += '<div class="cell blank"></div>';
    for (var c = 1; c <= days; c++) {
      var mk = view.y + "-" + pad(view.m + 1) + "-" + pad(c);
      h += '<button class="cell' + (mk === selected ? " sel" : "") + (mk === todayKey ? " today" : "") + '" data-day="' + mk + '">' + (stamped(mk) ? seal(mk) : slot(mk)) + stars(mk) + markHtml(mk) + note(mk) + "</button>";
    }
    h += "</div></section>";
    h += '<p class="foot">' + (mode === "account" ? "내 계정에 저장되고 있어요." : "이 폰에 저장되고 있어요. 가끔 백업해 두세요.") + '</p><button class="goto" data-settings="1">운동·보상 설정 바꾸기</button>' + backupHtml();
    app.innerHTML = h;
  }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("button");
    if (!el || el.disabled) return;
    if (el.dataset.day) { selected = el.dataset.day; justStamped = null; var d = dateOf(selected); view = { y: d.getFullYear(), m: d.getMonth() }; render(); }
    else if (el.dataset.task) toggle(selected, el.dataset.task);
    else if (el.dataset.extra) toggleExtra(selected);
    else if (el.dataset.mark) toggleMark(selected, el.dataset.mark);
    else if (el.dataset.chip) fillChip(el.dataset.chip);
    else if (el.dataset.ticket) toggleTicket(el.dataset.ticket);
    else if (el.dataset.settings) { editing = true; render(); window.scrollTo(0, 0); }
    else if (el.dataset.cancel) { editing = false; render(); }
    else if (el.dataset.export) exportData();
    else if (el.dataset.copy) copyData();
    else if (el.dataset.restore) restoreFrom(document.getElementById("restore-text").value);
    else if (el.dataset.todoDone) changeTodo(selected, el.dataset.todoDone, function (x) { return { id: x.id, t: x.t, d: true }; });
    else if (el.dataset.todoUndo) changeTodo(selected, el.dataset.todoUndo, function (x) { return { id: x.id, t: x.t, d: false }; });
    else if (el.dataset.todoDel) changeTodo(selected, el.dataset.todoDel, function () { return null; });
    else if (el.dataset.goto) { selected = el.dataset.goto; justStamped = null; var g = dateOf(selected); view = { y: g.getFullYear(), m: g.getMonth() }; render(); }
    else if (el.dataset.nav) { var m = view.m + +el.dataset.nav; view = { y: view.y + Math.floor(m / 12), m: ((m % 12) + 12) % 12 }; render(); }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "setup-form") { saveSettings(); return; }
    if (e.target.id !== "todo-form") return;
    addTodo(selected, document.getElementById("todo-text").value);
  });

  app.addEventListener("change", function (e) {
    if (e.target.id !== "restore-file" || !e.target.files[0]) return;
    var r = new FileReader();
    r.onload = function () { restoreFrom(String(r.result)); };
    r.readAsText(e.target.files[0]);
  });

  app.addEventListener("input", function (e) {
    if (e.target.id === "diary-text") { setDiary(selected, e.target.value); return; }
    if (e.target.id !== "extra-text") return;
    setExtraText(selected, e.target.value);
    var btn = app.querySelector("[data-extra]");
    if (btn) btn.disabled = !e.target.value.trim() || selected > todayKey;
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    var nk = keyOf(new Date());
    if (nk !== todayKey) { if (selected === todayKey) selected = nk; todayKey = nk; render(); }
  });

  function showErr(msg) {
    var el = document.getElementById("err");
    if (!el) { el = document.createElement("p"); el.id = "err"; el.className = "foot"; el.style.color = "var(--stamp)"; document.body.appendChild(el); }
    el.textContent = "오류: " + msg;
  }
  window.addEventListener("error", function (e) { showErr(e.message); });
  window.addEventListener("unhandledrejection", function (e) { showErr(e.reason && e.reason.message || e.reason); });

  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  load();
  migrateMarks();
  ready = !!state.settings.setup;
  render();
  setTimeout(setReady, 3000);

  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) { setReady(); return; }
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      if (!db || !user) { setReady(); return; }
      var uid = await user.id();
      if (!uid) { setReady(); return; }
      ref = db.doc("data/users/" + uid + "/stamps");
      mode = "account";
      unsub = ref.onSnapshot(function (snap) {
        // Local state is the source of truth after the first delivery; later snapshots can be stale echoes.
        if (applied || (snap.metadata && snap.metadata.hasPendingWrites)) return;
        applied = true;
        var data = snap.exists ? (snap.data() || {}) : {}, any = false;
        ["days", "extra", "period", "markDays", "diary", "todos", "rewards", "earned"].forEach(function (f) {
          var src = data[f] || {};
          Object.keys(src).forEach(function (k) { if (!touched[k]) { state[f][k] = src[k]; } else any = true; });
        });
        if (data.settings && !touchedSettings) state.settings = data.settings;
        else if (!data.settings && state.settings.setup) any = true;
        migrateMarks();
        saveLocal();
        ready = true;
        render();
        if (!snap.exists || any || touchedSettings || Object.keys(touched).length) flush();
      }, function () { ref = null; unsub = null; mode = "local"; setReady(); });
    } catch (e) { ref = null; mode = "local"; setReady(); }
  })();
})();
</script>
</body>
</html>
